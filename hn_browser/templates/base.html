<!doctype html>
<html lang="en">
<head>
    <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('hn-theme') || 'dark');</script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}HN Browser{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ff6600'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/theme.js" defer></script>
</head>
<body>
    <nav class="nav">
        <div class="wrap nav-inner">
            <a class="brand" href="/">
                <span class="dot"></span>
                <span>HN&nbsp;BROWSER<small>what's hot right now</small></span>
            </a>
            <div class="tabs">
                {% for p in presets %}<a class="tab{% if p.key == active_preset %} active{% endif %}" href="/{{ p.key }}">{{ p.label }}</a>{% endfor %}
            </div>
            <button class="theme-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">◑</button>
        </div>
    </nav>
    {% block content %}{% endblock %}
    <footer class="wrap foot">
        Data from the <a href="https://hn.algolia.com/api">Algolia Hacker News Search API</a>. Every story links back to
        <a href="https://news.ycombinator.com">Hacker News</a>.
    </footer>
</body>
</html>
